<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Цех — V24 SMART</title>
<meta name="theme-color" content="#f4b64c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#f8f5ef;--card:#fff;--text:#27231d;--muted:#75808f;--line:#e9e1d6;
 --accent:#f4b64c;--accent2:#fff0cc;--danger:#c95757;--good:#2f8a62;
 --shadow:0 12px 30px rgba(62,47,25,.08)
}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,video,canvas{max-width:100%;height:auto}
button,input,select,textarea{max-width:100%;min-width:0}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fffdf8,#f7f1e8);color:var(--text);min-height:100vh;padding-bottom:max(22px,env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:1180px;margin:auto;padding:14px}
.top{position:sticky;top:0;z-index:30;margin:0 -14px 12px;padding:12px 14px;background:rgba(248,245,239,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.brand{font-weight:950;font-size:20px}
.sub{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
h1,h2,h3{margin:.2em 0 .55em}h1{font-size:32px}h2{font-size:22px}h3{font-size:17px}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:13px;min-height:42px;padding:9px 13px;font-weight:850;cursor:pointer;background:var(--accent);color:#38270c;transition:.16s ease;box-shadow:0 5px 14px rgba(244,182,76,.14)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;filter:grayscale(.12);transform:none!important}
.btn.secondary{background:#fff;border:1px solid var(--line);color:#485464}
.btn.danger{background:#fff1f1;border:1px solid #f0d1d1;color:#9b3535}
.btn.good{background:#edf9f3;border:1px solid #ccebdd;color:#236c4d}
.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;color:var(--text);outline:none;font-size:16px}
.input:focus{border-color:#e3b450;box-shadow:0 0 0 4px rgba(244,182,76,.15)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:750;color:var(--muted)}
.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 10px;margin:0 0 12px;scrollbar-width:none;position:sticky;top:72px;z-index:25;background:rgba(248,245,239,.96);backdrop-filter:blur(12px)}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:800;color:#5a6472}.nav button.active{background:var(--accent2);border-color:#efd18c;color:#80580e}
.product{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;border:1px solid var(--line);border-radius:18px;padding:11px;background:#fffdfa;align-items:center;min-width:0;max-width:100%}
.product>*{min-width:0}
.product.unavailable{background:#f7f5f1;opacity:.82}
.product.unavailable .productPhoto{filter:grayscale(.25)}
.productInfo{min-width:0}
.productName{font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.productDesc{overflow-wrap:anywhere}
.soldout{display:inline-flex;margin-top:6px;padding:4px 8px;border-radius:999px;background:#f1ece6;color:#8c6553;font-size:11px;font-weight:850}
.productPhoto{width:72px;height:72px;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#fff0cf,#f7e5be);display:grid;place-items:center;color:#9a762d;font-size:25px;font-weight:900;border:1px solid #efdfbd}
.productPhoto img{width:100%;height:100%;object-fit:cover;display:block}
.catBar{display:flex;gap:7px;flex-wrap:wrap;overflow:visible;padding:2px 0 10px}.catBar::-webkit-scrollbar{display:none}.catBtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#697381;cursor:pointer}.catBtn.active{background:var(--accent2);border-color:#efd18c;color:#80580e}
.itemLine{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;border-bottom:1px dashed #ece4d9}.itemLine:last-child{border-bottom:0}
.orderFooter{display:grid;grid-template-columns:auto minmax(130px,180px);gap:10px;align-items:end;margin-top:12px}.orderTotal{font-size:22px;font-weight:950}.statusSelect{min-height:44px}
.invoiceBtn{margin-top:10px}
.menuGroup{margin:14px 0 18px}.menuGroupTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menuCard{border:1px solid var(--line);border-radius:18px;background:#fffdfa;padding:10px}.menuThumb{width:100%;aspect-ratio:16/10;border-radius:14px;background:linear-gradient(135deg,#fff0cf,#f7e5be);display:grid;place-items:center;color:#9a762d;font-weight:900;margin-bottom:9px;overflow:hidden}.menuThumb img{width:100%;height:100%;object-fit:cover}.menuCard .field{margin-bottom:7px}

.qty{display:flex;gap:8px;align-items:center}.qty button{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:21px;font-weight:900}.qty b{min-width:26px;text-align:center;font-size:18px}
.order{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fffdfa;margin-bottom:10px}
.orderhead{display:flex;justify-content:space-between;gap:10px}
.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#f2f3f5;color:#606a77}
.s-new{background:#fff3d0;color:#85600f}.s-work{background:#eaf4ff;color:#286799}.s-ready{background:#e9f9ef;color:#26724e}.s-done{background:#eef0f2;color:#5d6874}
.stat{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fffdfa}.stat b{display:block;font-size:26px;margin-top:5px}
.empty{text-align:center;color:var(--muted);border:1px dashed #d9cfc1;border-radius:16px;padding:28px;background:#fffdfa}
.toast{display:none;position:fixed;right:12px;bottom:82px;z-index:99;background:#2a2722;color:#fff;padding:11px 14px;border-radius:13px;box-shadow:var(--shadow)}
.loading{padding:35px;text-align:center;color:var(--muted)}
.shopCard{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;margin-bottom:12px;box-shadow:0 8px 22px rgba(62,47,25,.05)}
.shopCardHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.shopIndex{width:36px;height:36px;border-radius:12px;background:var(--accent2);display:grid;place-items:center;font-weight:950;color:#7a560e;flex:0 0 auto}
.shopMeta{min-width:0;flex:1}
.shopLinkWrap{display:flex;gap:8px;align-items:center}
.shopLinkWrap .input{font-size:12px;color:#717b88;background:#faf9f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shopActions .btn{width:100%;min-height:42px}
.shopActions .wide{grid-column:1/-1}
.shopActions .mutedAction{background:#faf9f6;border-color:var(--line);box-shadow:none;color:#5f6875}
.shopActions .dangerAction{background:#fff5f5;border-color:#f1d8d8;box-shadow:none;color:#a43d3d}
.adminProduct{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fffdfa;margin-bottom:10px}
.adminFields{display:grid;grid-template-columns:1fr 1.4fr .7fr .8fr;gap:8px}
.invoice{background:#fff;color:#111;padding:18px;border-radius:16px;border:1px solid var(--line);margin-top:12px;overflow:auto}
.invoiceBox{animation:fadeIn .14s ease}
@keyframes fadeIn{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
.invoiceToggleOpen{background:#fff7e4!important;border-color:#efd28f!important;color:#7d570f!important}
.invoice table{width:100%;border-collapse:collapse}.invoice th,.invoice td{border:1px solid #bbb;padding:7px;text-align:left}
.hero{padding:8px 0 14px}
.offline{background:#fff2e5;color:#94540f;border:1px solid #f1d0aa;padding:9px 12px;border-radius:12px;margin-bottom:10px;display:none}

/* V16: собственные окна, LIVE-синхронизация, аккуратный автосейв */
.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.modalActions .wide{grid-column:1/-1}
.modalDanger{background:#fff5f5;border:1px solid #f0d2d2;border-radius:16px;padding:12px;color:#8d3838;margin:10px 0}
.modalInfo{background:#fff8e8;border:1px solid #efddb2;border-radius:16px;padding:12px;color:#6f5520;margin:10px 0}
.modalChoice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modalChoice label{border:1px solid var(--line);border-radius:15px;padding:11px;background:#fffdfa;display:flex;gap:8px;align-items:center;font-weight:800}
.copyArea{width:100%;min-height:110px;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px;background:#faf9f6;color:#4f5966}
.autoSaved{font-size:11px;color:#2f8a62;font-weight:800;margin-top:5px}
.liveNote{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#2f8a62;font-weight:850}
.liveNote:before{content:"";width:8px;height:8px;border-radius:50%;background:#2f8a62;box-shadow:0 0 0 4px rgba(47,138,98,.12)}

@media(max-width:760px){
 body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
 .wrap{padding:10px;width:100%;max-width:100%}
 .top{margin:0 -10px 8px;padding:10px;position:sticky;top:0;left:0;right:0;max-width:calc(100% + 20px)}
 .brand{font-size:18px;overflow-wrap:anywhere}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 h1{font-size:clamp(25px,7.4vw,30px)}
 h2{font-size:21px}
 .card{padding:12px;border-radius:18px;min-width:0;max-width:100%}
 .nav{position:sticky;top:67px;z-index:24;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 10px;padding:7px 0;background:rgba(248,245,239,.97);border:0;box-shadow:none;overflow:visible}
 .nav button{width:100%;min-width:0;min-height:42px;padding:8px 7px;white-space:normal;line-height:1.05}
 .adminFields{grid-template-columns:1fr}
 .invoice{padding:11px;font-size:13px}
 .invoice table{min-width:0}
 .product{grid-template-columns:58px minmax(0,1fr) auto;padding:10px;gap:9px}
 .productPhoto{width:58px;height:58px;border-radius:13px}
 .qty{gap:4px;flex:0 0 auto}.qty button{width:38px;height:38px;font-size:20px}.qty b{min-width:18px;font-size:16px}
 .order{padding:12px;min-width:0;max-width:100%}
 .itemLine{font-size:15px;grid-template-columns:minmax(0,1fr) auto}
 .itemLine span{min-width:0;overflow-wrap:anywhere}
 .orderFooter{grid-template-columns:1fr;gap:8px}
 .orderTotal{font-size:21px}
 .statusSelect{max-width:none!important;width:100%}
 .invoiceBtn{width:100%;margin-top:8px}
 .menuGrid{grid-template-columns:1fr}
 .menuThumb{aspect-ratio:16/8}
 .toast{bottom:18px;left:10px;right:10px;text-align:center}
 .shopCard{padding:12px}
 .shopActions{grid-template-columns:1fr 1fr}
 .hero{padding-top:4px}
}
@media(max-width:380px){
 .wrap{padding:8px}
 .top{margin:0 -8px 8px;padding:9px 8px;max-width:calc(100% + 16px)}
 .brand{font-size:17px}
 .sub{font-size:11px}
 .top .btn{min-height:38px;padding:8px 10px}
 .nav{top:61px}
 .nav button{font-size:14px;padding:7px 5px}
 .product{grid-template-columns:52px minmax(0,1fr);align-items:start}
 .productPhoto{width:52px;height:52px;grid-row:1/span 2}
 .qty{grid-column:2;justify-self:start;margin-top:4px}
 .catBtn{padding:7px 9px;font-size:14px}
 .shopActions{grid-template-columns:1fr}
 .shopActions .wide{grid-column:auto}
}
@media print{
 body *{visibility:hidden!important}
 .invoicePrintArea,.invoicePrintArea *{visibility:visible!important}
 .invoicePrintArea{position:absolute!important;left:0;top:0;width:100%!important;background:#fff!important;max-height:none!important;overflow:visible!important}
 .noPrint,.invoiceModalToolbar{display:none!important}
}

.invoiceControls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.invoiceSummary{border:1px solid var(--line);border-radius:18px;background:#fffdfa;padding:13px;margin-top:12px}
.invoiceSection{margin:18px 0}
.invoiceSectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:8px}
.invoiceMiniTable{width:100%;border-collapse:collapse}
.invoiceMiniTable th,.invoiceMiniTable td{padding:8px 7px;border-bottom:1px solid #eee5d8;text-align:left}
.invoiceMiniTable th{font-size:11px;text-transform:uppercase;color:#7b8490}
.invoiceGrand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.invoiceGrand .stat{background:#fff}
@media(max-width:760px){
  .invoiceControls{grid-template-columns:1fr}
  .invoiceGrand{grid-template-columns:1fr}
  .invoiceSectionTitle{align-items:flex-start;flex-direction:column}
  .invoiceMiniTable{font-size:13px}
}


/* ===== V12: safe shop ordering + role-aware help ===== */
.shopPage{padding-bottom:105px}
.helpBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#5b6470;font-weight:950;font-size:18px;display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(62,47,25,.06)}
.nameHelp{display:flex;align-items:center;gap:8px;min-width:0}
.cartDock{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 20px));z-index:80}
.cartDock button{width:100%;min-height:58px;border:0;border-radius:18px;background:#2e2a24;color:#fff;box-shadow:0 14px 35px rgba(43,35,23,.24);padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:900}
.cartDock .cartMain{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12}
.cartDock .cartSub{font-size:12px;opacity:.78;font-weight:700;margin-top:3px}
.qty{flex-wrap:wrap;justify-content:flex-end}
.qty .qtyInput{width:58px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:center;font-weight:900;font-size:17px;padding:4px}
.qty .plusTen{width:auto;min-width:52px;padding:0 8px;font-size:15px;background:var(--accent2);color:#80580e;border-color:#efd18c}
.modalBack{position:fixed;inset:0;width:100vw;height:100dvh;z-index:110;background:rgba(27,24,20,.55);display:grid;place-items:center;padding:14px;overflow:hidden;overscroll-behavior:contain}
.modalSheet{width:min(720px,100%);max-height:calc(100dvh - 28px);overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:24px;padding:16px;border:1px solid var(--line);box-shadow:0 25px 65px rgba(0,0,0,.24);position:relative}
.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:#fff;padding:2px 0 10px;z-index:2}
body.modalOpen{overflow:hidden;touch-action:none}
.closeBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.cartRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed #e8dfd3}
.cartRow:last-child{border-bottom:0}
.cartRowName{font-weight:900;overflow-wrap:anywhere}
.dayPick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.dayBtn{border:1px solid var(--line);background:#fff;border-radius:14px;min-height:48px;padding:9px;font-weight:900;cursor:pointer}
.dayBtn.active{background:var(--accent2);border-color:#e6bd61;color:#77510b}
.existingWarn{border:1px solid #efd18c;background:#fff9e9;border-radius:16px;padding:12px;margin:10px 0}
.confirmBox{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#faf9f6;border-radius:14px;padding:12px;margin-top:12px;cursor:pointer}
.confirmBox input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
.additionBox{border:1px solid #e7d5a9;background:#fff9e8;border-radius:14px;padding:10px;margin-top:10px}
.additionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.additionBadge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#fff0bd;color:#80580e;font-size:11px;font-weight:900}
.helpSection{padding:12px 0;border-bottom:1px solid var(--line)}
.helpSection:last-child{border-bottom:0}
.helpSection h3{margin:0 0 6px}
.helpSection p,.helpSection li{line-height:1.45}
.helpSection ul{padding-left:20px;margin:7px 0}
.orderDatePill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef5ff;color:#315e91;font-size:11px;font-weight:850;margin-top:5px}
.targetSummary{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffdfa;margin:10px 0}
.inlineNote{font-size:12px;color:var(--muted);line-height:1.4}
@media(max-width:760px){
  .shopPage{padding-bottom:100px}
  .product{grid-template-columns:58px minmax(0,1fr);align-items:start}
  .productPhoto{grid-row:1/span 2}
  .qty{grid-column:2;justify-self:start;justify-content:flex-start;margin-top:4px}
  .qty button{width:38px;height:38px}
  .qty .qtyInput{width:52px;height:38px;font-size:16px}
  .qty .plusTen{height:38px;min-width:48px}
  .modalBack{padding:10px;place-items:center}
  .modalSheet{border-radius:22px;max-height:calc(100dvh - 20px);padding:14px}
  .modalHead{top:-14px}
  .cartRow{grid-template-columns:1fr}
  .cartRow .qty{grid-column:auto}
}
@media(max-width:390px){
  .dayPick{grid-template-columns:1fr}
}

/* V13: restored employees/settings + role-aware order privacy */
.staffList{display:grid;gap:10px;margin-top:12px}
.staffCard{border:1px solid var(--line);border-radius:18px;padding:13px;background:#fffdfa}
.staffCardHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.staffFields{display:grid;grid-template-columns:1.2fr .8fr .7fr;gap:8px;align-items:end}
.staffActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.staffActions .wide{grid-column:1/-1}
.roleLock{padding:9px 11px;border:1px solid var(--line);border-radius:13px;background:#f7f5f1;color:#66717f;font-size:13px}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.secretBox{border:1px solid var(--line);border-radius:16px;padding:12px;background:#faf9f6;overflow-wrap:anywhere}
.viewerNotice{padding:9px 11px;border-radius:13px;background:#eef5ff;color:#315f8d;font-size:12px;font-weight:750;margin-top:10px}
@media(max-width:760px){
 .staffFields,.settingsGrid{grid-template-columns:1fr}
 .staffActions{grid-template-columns:1fr}
 .staffActions .wide{grid-column:auto}
}

/* V17: категории, фото, стабильные модалки и мобильные накладные */
.categoryManager{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fffaf0;margin:12px 0 18px}
.categoryRow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end;padding:9px 0;border-bottom:1px dashed #eadfce}
.categoryRow:last-child{border-bottom:0}
.categoryRow .field{margin:0}
.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
.photoActions .btn{width:100%}
.hiddenFile{display:none!important}
.uploading{opacity:.55;pointer-events:none}
.invoiceMobileCards{display:none}
.invoiceMobileCard{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffdfa;margin:8px 0}
.invoiceMobileRow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #eadfce}
.invoiceMobileRow:last-child{border-bottom:0}
.pwaCard{background:#fff8e8;border:1px solid #efddb2;border-radius:16px;padding:12px;margin-top:10px}
@media(max-width:760px){
 .categoryRow{grid-template-columns:1fr}
 .categoryRow .btn{width:100%}
 .invoiceOrderTable{display:none}
 .invoiceMobileCards{display:block}
 .invoiceMiniTable{width:100%;table-layout:fixed;min-width:0!important}
 .invoiceMiniTable th,.invoiceMiniTable td{overflow-wrap:anywhere;padding:7px 4px}
}
@media print{

async function syncLive(reason="push"){
 if(syncBusy||uiBusy)return;
 syncBusy=true;
 try{
   const before=dataSignature();
   const previousRole=staff?.role;
   if(STAFF_TOKEN){
     await refreshStaffData();
     if(isAdmin()&&tab==="invoices")await loadInvoiceOrders();
   }else if(SHOP_TOKEN){
     await loadShop();
     basket=Object.fromEntries(Object.entries(basket).filter(([id])=>products.some(p=>p.id===id&&p.active&&!p.archived)));
   }
   const after=dataSignature();
   if(reason==="fallback"&&liveState!=="live")liveState="fallback";
   paintLiveBadge();
   if(before!==after||previousRole!==staff?.role){
     if(STAFF_TOKEN)requestSmartStaffRender(previousRole!==staff?.role);
     else if(SHOP_TOKEN){if(isEditingField())pendingLiveRender=true;else renderShopPreserve();}
   }
 }catch(e){
   const msg=String(e?.message||e||"");
   if(/недействительна|Invalid shop link|Access denied/i.test(msg)){
     clearInterval(liveTimer);
     try{if(liveChannel)client.removeChannel(liveChannel)}catch(_){}
     liveState="off";
     errBox(new Error(STAFF_TOKEN?"Доступ этого сотрудника отключён или аккаунт удалён.":"Эта ссылка магазина отключена или удалена."));
     return;
   }
   liveState="fallback";paintLiveBadge();
   const off=document.getElementById("offline");if(off)off.style.display="block";
 }finally{syncBusy=false}
}

function setupDynamicManifest(){
 try{
   const link=document.querySelector('link[rel="manifest"]');if(!link)return;
   const dir=new URL("./",location.href);
   const launch=location.pathname+location.search;
   const manifest={
     name:"Цех — заказы",
     short_name:"Цех",
     description:"Заказы магазинов, накладные и рабочая панель цеха",
     id:launch||location.pathname,
     start_url:launch||location.pathname,
     scope:dir.pathname,
     display:"standalone",
     background_color:"#f8f5ef",
     theme_color:"#f4b64c",
     icons:[
       {src:new URL("./icon-192.png",location.href).href,sizes:"192x192",type:"image/png"},
       {src:new URL("./icon-512.png",location.href).href,sizes:"512x512",type:"image/png"}
     ]
   };
   if(dynamicManifestUrl)URL.revokeObjectURL(dynamicManifestUrl);
   dynamicManifestUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
   link.href=dynamicManifestUrl;
 }catch(e){console.warn("Manifest",e)}
}

async function registerServiceWorker(){
 try{
   if(!("serviceWorker" in navigator))return;
   const resetKey="ceh_cache_reset_v24";
   if(localStorage.getItem(resetKey)!==BUILD){
     try{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}catch(_){}
     try{if("caches" in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(_){}
     localStorage.setItem(resetKey,BUILD);
   }
   const reg=await navigator.serviceWorker.register("./sw.js?v=24",{updateViaCache:"none"});
   try{await reg.update()}catch(_){}
 }catch(e){console.warn("SW",e)}
}

function localInvoiceOrdersForDate(dateValue=invoiceDate){
 return (orders||[]).filter(o=>String(o.order_date||"").slice(0,10)===dateValue);
}
async function loadInvoiceOrders(targetDate=invoiceDate){
 const requestDate=targetDate||invoiceDate;
 const seq=++invoiceLoadSeq;
 if(requestDate===invoiceDate){
   invoiceOrders=localInvoiceOrdersForDate(requestDate);
   invoiceLoadState="loading";
   invoiceLoadError="";
 }
 try{
   const r=await client.rpc("v19_invoice_orders",{target_date:requestDate});
   if(r.error)throw r.error;
   let data=r.data;
   if(typeof data==="string"){try{data=JSON.parse(data)}catch(_){}}
   if(seq!==invoiceLoadSeq||requestDate!==invoiceDate)return false;
   if(Array.isArray(data))invoiceOrders=data;
   invoiceLoadState="ready";
   invoiceLoadError="";
   return true;
 }catch(e){
   if(seq!==invoiceLoadSeq||requestDate!==invoiceDate)return false;
   invoiceOrders=localInvoiceOrdersForDate(requestDate);
   invoiceLoadState="fallback";
   invoiceLoadError=String(e?.message||e||"Не удалось загрузить накладные");
   return false;
 }
}

function aggregateItems(os){
 const map=new Map();
 os.forEach(o=>(o.order_items||[]).forEach(i=>{
   const key=i.product_name;
   const cur=map.get(key)||{name:i.product_name,qty:0,sum:0,unit_price:i.unit_price};
   cur.qty+=Number(i.quantity)||0;
   cur.sum+=(Number(i.unit_price)||0)*(Number(i.quantity)||0);
   cur.unit_price=i.unit_price;
   map.set(key,cur);
 }));
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"ru"));
}

async function saveProduct(id,silent=false,moveGroup=false){
 const el=x=>document.getElementById(x+id);
 const data={
   category:el("c_")?.value?.trim()||"Другое",
   name:el("n_")?.value?.trim(),
   price:Math.round(Number(el("p_")?.value)),
   description:el("d_")?.value?.trim()||"",
   active:el("a_")?.value==="true"
 };
 if(!data.name||!Number.isFinite(data.price)||data.price<0)return toast("Проверьте название и цену");
 const r=await client.rpc("v19_product_update",{
   target_id:id,
   new_name:data.name,
   new_category:data.category,
   new_price:data.price,
   new_description:data.description,
   new_active:data.active
 });
 if(r.error)return toast("Не удалось сохранить товар: "+r.error.message);
 const p=products.find(x=>x.id===id);if(p)Object.assign(p,data);
 await notifyLive("menu");
 if(!silent)toast("Товар сохранён");
 if(moveGroup)updateStaffPanelPreserve();
}

     return {source:bmp,width:bmp.width,height:bmp.height,close:()=>bmp.close?.()};
   }catch(_){}
 }
 return await new Promise((resolve,reject)=>{
   const url=URL.createObjectURL(file);
   const img=new Image();
   img.onload=()=>resolve({source:img,width:img.naturalWidth,height:img.naturalHeight,close:()=>URL.revokeObjectURL(url)});
   img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Не удалось прочитать изображение"))};
   img.src=url;
 });
}
async function compressProductImage(file){
 const decoded=await loadImageSource(file);
 try{
   const maxSide=1000;
   const scale=Math.min(1,maxSide/Math.max(decoded.width,decoded.height));
   const w=Math.max(1,Math.round(decoded.width*scale));
   const h=Math.max(1,Math.round(decoded.height*scale));
   const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext("2d",{alpha:false});
   ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
   ctx.drawImage(decoded.source,0,0,w,h);
   const webpProbe=canvas.toDataURL("image/webp",0.7);
   const type=webpProbe.startsWith("data:image/webp")?"image/webp":"image/jpeg";
   let quality=.82,blob=null;
   for(let i=0;i<5;i++){
     blob=await canvasToBlob(canvas,type,quality);
     if(blob&&blob.size<=180*1024)break;
     quality-=.09;
   }
   if(!blob)throw new Error("Не удалось сжать фото");
   if(blob.size>260*1024)throw new Error("Фото получилось слишком большим после сжатия");
   return blob;
 }finally{decoded.close?.()}
}

function urlBase64ToUint8ArrayV24(base64String){const padding="=".repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function refreshPushRuntimeState(){
 pushEnabled=false;pushRuntimeEndpoint="";
 if(!STAFF_TOKEN||!("serviceWorker" in navigator)||!("PushManager" in window))return;
 try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return;pushRuntimeEndpoint=sub.endpoint;pushEnabled=true;const r=await client.rpc("v23_push_state",{target_endpoint:sub.endpoint});if(!r.error&&r.data){pushPrefs={new_orders:r.data.new_orders!==false,additions:r.data.additions!==false,status_changes:r.data.status_changes===true}}}catch(e){console.warn("push state",e)}
}
async function enablePushV24(){
 if(!STAFF_TOKEN)return;
 if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window))return toast("Этот браузер не поддерживает Push");
 const permission=await Notification.requestPermission();if(permission!=="granted")return toast("Разрешение на уведомления не выдано");
 try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8ArrayV24(V24_VAPID_PUBLIC_KEY)});const j=sub.toJSON();const r=await client.rpc("v23_push_register",{subscription:j,launch_url_in:location.href.split("#")[0],user_agent_in:navigator.userAgent});if(r.error)throw r.error;pushEnabled=true;pushRuntimeEndpoint=sub.endpoint;pushPrefs={new_orders:true,additions:true,status_changes:false};localStorage.setItem("ceh_v23_sound","1");renderOverlay();toast("Уведомления включены ✅")}catch(e){console.error(e);toast("Не удалось включить Push. Проверьте SQL и Edge Function")}
}
async function disablePushV24(){
 try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await client.rpc("v23_push_unregister",{target_endpoint:sub.endpoint});await sub.unsubscribe()}pushEnabled=false;pushRuntimeEndpoint="";renderOverlay();toast("Push выключен")}catch(e){toast("Не удалось выключить уведомления")}
}
async function savePushPrefsV24(){
 if(!pushRuntimeEndpoint)return toast("Сначала включите Push");
 const prefs={new_orders:!!document.getElementById("push_new")?.checked,additions:!!document.getElementById("push_add")?.checked,status_changes:!!document.getElementById("push_status")?.checked};
 const r=await client.rpc("v23_push_preferences",{target_endpoint:pushRuntimeEndpoint,want_new_orders:prefs.new_orders,want_additions:prefs.additions,want_status_changes:prefs.status_changes});if(r.error)return toast("Не удалось сохранить настройки");pushPrefs=prefs;localStorage.setItem("ceh_v23_sound",document.getElementById("push_sound")?.checked?"1":"0");toast("Настройки уведомлений сохранены")

let v24ScheduleState={allowed_dates:[],override_active:false,weekend_override_until:null,weekend_default_closed:true};

function v24DateAtNoon(dateStr){return new Date(`${dateStr}T12:00:00+05:00`)}
function v24IsoDate(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Almaty",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function v24LocalDatePlus(dateStr,days){const d=v24DateAtNoon(dateStr);d.setDate(d.getDate()+days);return v24IsoDate(d)}
function v24Dow(dateStr){const d=v24DateAtNoon(dateStr);return Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Almaty",weekday:"short"}).format(d)==="Sat"?6:new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Almaty",weekday:"short"}).format(d)==="Sun"?7:["Mon","Tue","Wed","Thu","Fri"].indexOf(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Almaty",weekday:"short"}).format(d))+1)}
function v24ShortDate(dateStr){return new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Almaty",weekday:"short",day:"2-digit",month:"2-digit"}).format(v24DateAtNoon(dateStr)).replace(/^./,c=>c.toUpperCase())}
function v24FullDate(dateStr){return new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Almaty",weekday:"long",day:"2-digit",month:"long"}).format(v24DateAtNoon(dateStr))}
function v24FallbackAllowedDates(){
 const t=todayBiz(),dow=v24Dow(t);
 if(dow===6)return [v24LocalDatePlus(t,2)];
 if(dow===7)return [v24LocalDatePlus(t,1)];
 let next=v24LocalDatePlus(t,1);while([6,7].includes(v24Dow(next)))next=v24LocalDatePlus(next,1);
 return [t,next];
}
function v24AllowedDates(){const a=Array.isArray(v24ScheduleState?.allowed_dates)?v24ScheduleState.allowed_dates.filter(Boolean):[];return a.length?a:v24FallbackAllowedDates()}
function v24NormalizeTarget(){const a=v24AllowedDates();if(a.length&&!a.includes(orderTargetDate))orderTargetDate=a[0]}
async function loadScheduleV24(){

 v24NormalizeTarget();return v24ScheduleState;
}

function v24TimeOnly(ts){try{return new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Almaty",hour:"2-digit",minute:"2-digit"}).format(new Date(ts))}catch(_){return ""}}
ordersPanel=function(){
 if(!orders.length)return `<div class="empty">Пока нет заказов.</div>`;
 const showMoney=isAdmin(),statuses=allowedStatusList();
 const filterDefs=[["all","Все",orders.length],["new","Новые",v23OrderCount("new")],["work","В работе",v23OrderCount("work")],["ready","Готово",v23OrderCount("ready")]];if(isAdmin())filterDefs.push(["done","Выдано",v23OrderCount("done")],["cancelled","Отменены",v23OrderCount("cancelled")]);
 const visible=v23OrderFilter==="all"?orders:orders.filter(o=>o.status===v23OrderFilter);
 return `<div class="v23OrdersPanel"><div class="v23PanelTitle"><h2>Заказы</h2><span class="small muted">${visible.length} из ${orders.length}</span></div><div class="v23StatusFilters">${filterDefs.map(([id,label,count])=>`<button class="${v23OrderFilter===id?"active":""}" onclick="setOrderFilterV23('${id}')">${label} · ${count}</button>`).join("")}</div>${visible.length?`<div class="v23Orders">${visible.map(o=>`<article id="order-${o.id}" class="v23Order"><div class="v23OrderTop"><div><div class="v23OrderTitle">#${o.order_number} • ${esc(shopName(o.shop_id))}</div><div class="v23OrderMeta"><span class="v24MetaChip date">📅 ${esc(orderDayLabel(o.order_date))}</span><span class="v24MetaChip">🕒 ${esc(v24TimeOnly(o.created_at))}</span>${o.updated_at&&o.updated_at!==o.created_at?`<span class="v24MetaChip">обновлён ${esc(v24TimeOnly(o.updated_at))}</span>`:""}</div>${v23OrderThumbs(o)}</div><span class="pill s-${o.status}">${st(o.status)}</span></div><div class="v23OrderItems">${(o.order_items||[]).map(i=>`<div class="itemLine"><span>${esc(i.product_name)} × <b>${i.quantity}</b></span>${showMoney?`<b>${money(i.unit_price*i.quantity)}</b>`:""}</div>`).join("")}</div>${orderAdditionsForStaff(o)}<div class="orderFooter ${showMoney?"":"viewerOnly"}">${showMoney?`<div class="orderTotal">${money(total(o))}</div>`:""}<select class="input statusSelect" onchange="changeStatus('${o.id}',this.value,this)">${statuses.map(x=>`<option value="${x}" ${o.status===x?"selected":""}>${st(x)}</option>`).join("")}</select></div>${showMoney?`<button class="btn secondary invoiceBtn" onclick="openOrderInvoice('${o.id}')">Накладная заказа</button>`:""}</article>`).join("")}</div>`:`<div class="empty">В этой группе заказов нет.</div>`}</div>`;
}

/* Store-specific invoice is open by default; summary stores remain collapsed. */
invoiceStoreCardHtml=function(sid,shopOrders){

 return `<section class="invoiceStoreCard ${open?"open":""}"><button class="invoiceStoreHead" type="button" onclick="${invoiceShop==="all"?`toggleInvoiceStore('${sid}')`:"void(0)"}"><span class="invoiceStoreIcon">🏪</span><span class="invoiceStoreName"><b>${esc(shopName(sid))}</b><small>${invoiceStoreOrderLabel(shopOrders.length)}</small></span><span class="invoiceStoreQty">${qty} шт.</span><span class="invoiceStoreSum">${money(sum)}</span><span class="invoiceChevron">${invoiceShop==="all"?(open?"⌃":"⌄"):"✓"}</span></button>${open?`<div class="invoiceStoreBody"><div class="invoiceStoreTableHead"><span>Товар</span><span>Кол-во</span><span>Сумма</span></div>${items.map(i=>`<div class="invoiceStoreItem"><div class="invoiceStoreProduct">${invoiceThumb(i)}<span>${esc(i.name)}</span></div><b>${i.qty} шт.</b><b>${money(i.sum)}</b></div>`).join("")}</div>`:""}</section>`;

invoiceScreenV21Html=function(os,grouped,allItems,totalMoney,formattedDate){

 const top=`<div class="invoiceV21Top"><div class="invoiceDateChipV22"><span>Дата</span><b>${formattedDate}</b></div>${allMode?`<div class="invoiceTabs"><button class="${invoiceViewMode==="stores"?"active":""}" onclick="setInvoiceViewMode('stores')">🏪 <span>По магазинам</span></button><button class="${invoiceViewMode==="production"?"active":""}" onclick="setInvoiceViewMode('production')">🏭 <span>К производству</span></button></div>`:`<div class="v24StoreInvoiceIntro"><div><b>${esc(invoiceSelectedShopLabel())}</b><small>Накладная точки за выбранную дату</small></div><span class="invoiceStoreSum">${qtyTotal(os)} шт.</span></div>`}<div class="invoiceMetrics"><div><span class="metricIcon m1">🧾</span><small>Всего заказов</small><b>${os.length}</b></div><div><span class="metricIcon m2">📦</span><small>Всего изделий</small><b>${qtyTotal(os)} шт.</b></div><div><span class="metricIcon m3">₸</span><small>Общая сумма</small><b>${money(totalMoney)}</b></div></div></div>`;

 return `<div class="invoiceScreenV21 noPrint">${top}${content}<div class="invoiceBottomSpacer"></div><div class="invoiceBottomActions"><button class="btn secondary" onclick="printInvoice()">🖨️ Печать / PDF</button><button class="btn invoiceSavePdf" onclick="printInvoice()">📄 Сохранить PDF</button></div></div>`;
}

||0)*(Number(i.quantity)||0))}</b></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2">ИТОГО:</td><td>${q} шт.</td><td></td><td>${money(sum)}</td></tr></tfoot></table></div><div class="printSignatures"><span>Отпустил: ____________________</span><span>Принял: ____________________</span></div></div></div>`;

/* Print in an isolated frame: avoids blank Android PDFs caused by a fixed modal body. */
const V24_PRINT_CSS=`
@page{size:A4 portrait;margin:9mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#24170f;font-family:Arial,Helvetica,sans-serif}.invoicePrintArea{display:block!important;visibility:visible!important;width:100%;max-width:none}.invoicePrintDocument{font-size:12pt}.printHeader{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid #e8d7bb;padding:0 0 9px}.printHeader h1{margin:0;font-size:25pt;line-height:1;letter-spacing:-.4px}.printHeader p{margin:5px 0 0;color:#6d665d;font-size:11.5pt}.printDate{min-width:125px;background:#fff4df;border:1px solid #ead5b1;border-radius:12px;padding:8px 10px}.printDate span{display:block;font-size:8.5pt;color:#776f66}.printDate b{display:block;font-size:14pt;margin-top:2px}.printMetrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #eadfce;border-radius:12px;overflow:hidden;margin:10px 0}.printMetrics.four{grid-template-columns:repeat(4,1fr)}.printMetrics>div{padding:9px;border-right:1px solid #eadfce;background:#fffaf1;min-width:0}.printMetrics>div:last-child{border-right:0}.printMetrics small{display:block;color:#746d64;font-size:8.5pt}.printMetrics b{display:block;margin-top:3px;font-size:14pt;overflow-wrap:anywhere}.printSection{margin-top:11px;break-inside:auto}.printSectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f8e5be;border:1px solid #e5c98f;border-radius:9px 9px 0 0;padding:7px 9px;font-size:14pt;font-weight:900}.printTable{width:100%;border-collapse:collapse;table-layout:auto}.printTable th,.printTable td{border:1px solid #ddd2c1;padding:6px 7px;text-align:left;vertical-align:middle}.printTable th{font-size:8.5pt;background:#fff9ee;color:#686159;text-transform:uppercase}.printTable td{font-size:10.5pt}.productionTable td{font-size:11pt}.productionTable td:nth-last-child(-n+2){white-space:nowrap}.printTable tfoot td{font-weight:900;background:#fff1d0}.printProductCell{display:flex;align-items:center;gap:8px}.invoicePrintThumb{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;overflow:hidden;background:#fff0cc;flex:0 0 auto}.invoicePrintThumb img{width:100%;height:100%;object-fit:cover}.invoiceThumbFallback{font-size:18px}.printSignatures{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:16px;font-size:10.5pt}.noPrint{display:none!important}@media print{.printSection,.printTable tr{break-inside:avoid}.printSection{break-inside:auto}}`;
printInvoice=async function(){
 const source=document.querySelector(".invoicePrintArea");if(!source)return toast("Не удалось подготовить PDF");
 try{
  const frame=document.createElement("iframe");frame.setAttribute("aria-hidden","true");frame.style.cssText="position:fixed;left:-10000px;top:0;width:1000px;height:1400px;border:0;background:#fff";document.body.appendChild(frame);
  const doc=frame.contentDocument;doc.open();doc.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Накладная</title><style>${V24_PRINT_CSS}</style></head><body>${source.outerHTML}</body></html>`);doc.close();
  const imgs=[...doc.images];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res})));await new Promise(r=>setTimeout(r,180));
  const win=frame.contentWindow;win.focus();win.onafterprint=()=>setTimeout(()=>frame.remove(),150);win.print();setTimeout(()=>{if(frame.isConnected)frame.remove()},12000);
 }catch(e){console.warn("print v24",e);window.print()}
}
